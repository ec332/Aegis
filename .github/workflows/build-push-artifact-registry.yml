name: build-push-artifact-registry

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGION: asia-southeast1
  REPOSITORY: aegis
  CACHE_REPOSITORY: aegis-cache

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ api-gateway, market, wallet, settlement, transaction-service ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Missing secret GCP_SA_KEY (service account JSON)"; exit 1; fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "Missing secret GCP_PROJECT_ID (GCP project id)"; exit 1; fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repositories
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" || \
          gcloud artifacts repositories create "$REPOSITORY" --repository-format=docker --location="$REGION"
          gcloud artifacts repositories describe "$CACHE_REPOSITORY" --location="$REGION" || \
          gcloud artifacts repositories create "$CACHE_REPOSITORY" --repository-format=docker --location="$REGION"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.CACHE_REPOSITORY }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.CACHE_REPOSITORY }}/${{ matrix.service }}:cache,mode=max
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
