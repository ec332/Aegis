name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Go Build
        run: go build ./cmd/transaction-service
      - name: Go Test
        run: go test ./...

  go-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          thresh=70
          awk -v t=$thresh -v v=$total 'BEGIN { if (v+0 < t+0) { printf("Coverage %.2f%% < threshold %d%%\n", v, t); exit 1 } else { printf("Coverage %.2f%% >= threshold %d%%\n", v, t); } }'
      - name: Upload Go coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: local/aegis:ci

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transaction
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transaction" 
          --health-interval 5s 
          --health-timeout 3s 
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d transaction && exit 0
            sleep 2
          done
          exit 1
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d transaction -f transaction-service/sql/create.sql
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run integration tests
        env:
          APP_DB_HOST: localhost
          APP_DB_PORT: 5432
          APP_DB_NAME: transaction
          APP_DB_USER: postgres
          APP_DB_PASSWORD: postgres
        run: go test -tags integration ./internal/store/postgres -v
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.0
          args: --timeout=3m

  fe-lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: aegis-fe
        run: npm ci
      - name: Run ESLint
        working-directory: aegis-fe
        run: npm run lint
      - name: Run Prettier check
        working-directory: aegis-fe
        run: npm run format:check

  fe-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: aegis-fe
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: aegis-fe
        run: npx playwright install --with-deps
      - name: Build Next app
        working-directory: aegis-fe
        run: npm run build
      - name: Run Playwright tests
        working-directory: aegis-fe
        run: npx playwright test --reporter=html
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aegis-fe/playwright-report

  fe-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: aegis-fe
        run: npm ci
      - name: Run Vitest coverage with thresholds
        working-directory: aegis-fe
        run: npm run test:coverage
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: fe-coverage
          path: |
            aegis-fe/coverage
