name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Go Build
        run: go build ./cmd/transaction-service
      - name: Go Test
        run: go test ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: local/aegis:ci

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transaction
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transaction" 
          --health-interval 5s 
          --health-timeout 3s 
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d transaction && exit 0
            sleep 2
          done
          exit 1
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d transaction -f transaction-service/sql/create.sql
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run integration tests
        env:
          APP_DB_HOST: localhost
          APP_DB_PORT: 5432
          APP_DB_NAME: transaction
          APP_DB_USER: postgres
          APP_DB_PASSWORD: postgres
        run: go test -tags integration ./internal/store/postgres -v