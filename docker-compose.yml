version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./transaction-service/sql/create.sql:/docker-entrypoint-initdb.d/01_create.sql:ro
      - ./market/sql/create.sql:/docker-entrypoint-initdb.d/02_create_market.sql:ro
      - ./wallet-service/sql/create.sql:/docker-entrypoint-initdb.d/03_create_wallet.sql:ro
      - ./settlement-service/sql/create.sql:/docker-entrypoint-initdb.d/04_create_settlement.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      MARKET_SERVICE_URL: http://market-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      SETTLEMENT_SERVICE_URL: http://settlement-service:8084
      TRANSACTION_SERVICE_URL: http://transaction-service:5555
    depends_on:
      - market-service
      - wallet-service
      - settlement-service
      - transaction-service
    ports:
      - "8080:8080"

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: transaction
      APP_DB_USER: postgres
      APP_DB_PASSWORD: postgres
      APP_HTTP_PORT: 5555
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5555:5555"

  market-service:
    build:
      context: ./market
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aegis_market
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  settlement-service:
    build:
      context: ./settlement-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aegis_settlement
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aegis_wallet
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

volumes:
  pgdata: