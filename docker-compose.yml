services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./market/sql/create.sql:/docker-entrypoint-initdb.d/02_create_market.sql:ro
      - ./wallet/sql/create.sql:/docker-entrypoint-initdb.d/03_create_wallet.sql:ro
      - ./settlement/sql/create.sql:/docker-entrypoint-initdb.d/04_create_settlement.sql:ro
      - ./transaction-service/create.sql:/docker-entrypoint-initdb.d/05_create_transactions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      PORT: 8080
      MARKET_SERVICE_GRPC_ADDR: market-service:50051
      WALLET_SERVICE_GRPC_ADDR: wallet-service:50052
      SETTLEMENT_SERVICE_GRPC_ADDR: settlement-service:50053
      TRANSACTION_SERVICE_GRPC_ADDR: transaction-service:50052
      KAFKA_BROKERS: kafka:29092
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
      CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_HEADERS: "Accept,Content-Type,Authorization"
    depends_on:
      market-service:
        condition: service_started
      wallet-service:
        condition: service_started
      settlement-service:
        condition: service_started
      transaction-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8080:8080"

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    environment:
      APP_GRPC_PORT: 50052
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: postgres
      APP_DB_USER: postgres
      APP_DB_PASSWORD: postgres
      APP_MARKET_GRPC_ADDR: market-service:50051
      APP_WALLET_SERVICE_GRPC_ADDR: wallet-service:50052
    depends_on:
      postgres:
        condition: service_healthy
      market-service:
        condition: service_started
    # internal-only; requests go through API Gateway

  market-service:
    build:
      context: .
      dockerfile: market/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # internal-only; requests go through API Gateway

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  settlement-service:
    build:
      context: .
      dockerfile: settlement/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      GRPC_PORT: 50053
      WALLET_GRPC_ADDR: wallet-service:50052
    depends_on:
      postgres:
        condition: service_healthy
    # internal-only; requests go through API Gateway

  wallet-service:
    build:
      context: .
      dockerfile: wallet/Dockerfile
    environment:
      WALLET_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      WALLET_SERVICE_PORT: 50052
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      GRPC_PORT: 50052
    depends_on:
      postgres:
        condition: service_healthy
    # internal-only; requests go through API Gateway

volumes:
  pgdata:
  kafka-data:
